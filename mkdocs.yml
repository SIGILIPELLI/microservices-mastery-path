  - "Level 4 · Organizing, Migrating & Operating Microservices":
      - Overview: level-4/index.md
      - "01 · The Strangler Fig Pattern: Migrating a Monolith Incrementally": level-4/01-strangler-fig-pattern.md
      - "02 · Team Topologies & Conway's Law": level-4/02-team-topologies-conways-law.md
      - "03 · Versioning & Backward Compatibility Across Services": level-4/03-versioning-backward-compatibility.md
