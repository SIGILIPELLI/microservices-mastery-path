      - "02 · Retries, Timeouts & Backoff Done Right": level-3/02-retries-timeouts-backoff.md
      - "03 · Bulkheads & Resource Isolation": level-3/03-bulkheads-resource-isolation.md
      - "04 · Rate Limiting Between Services": level-3/04-rate-limiting-between-services.md
      - "05 · Service Mesh Fundamentals: The Sidecar Pattern": level-3/05-service-mesh-sidecar.md
      - "06 · Traffic Management: Canary Releases at the Service Level": level-3/06-canary-traffic-management.md
      - "07 · mTLS & Service-to-Service Security": level-3/07-mtls-service-security.md
